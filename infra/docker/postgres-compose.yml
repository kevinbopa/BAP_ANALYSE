services:
  postgres:
    image: postgres:16-alpine
    container_name: spe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sports_prediction_engine
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - spe_postgres_data:/var/lib/postgresql/data

volumes:
  spe_postgres_data:

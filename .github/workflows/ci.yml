name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Smoke and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            services/ingestion/requirements.txt
            services/prediction/requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --no-input --prefer-binary -r services/ingestion/requirements.txt -r services/prediction/requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Run checks
        run: npm run check
